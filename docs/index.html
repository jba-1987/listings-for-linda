<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LISTINGS FOR LINDA</title>
<style>
  :root {
    /* Mexican folklore palette: serape pink, periwinkle, marigold, teal, magenta, orange, green */
    --bg: #fdf6ea;
    --panel: #fffdf8;
    --border: #ecd9b8;
    --text: #2c2116;
    --text-dim: #8a7355;
    --pink: #ec5d8c;
    --periwinkle: #7b80cc;
    --marigold: #f2ab13;
    --teal: #14a79c;
    --magenta: #d6289c;
    --orange: #f2792e;
    --green: #23a15c;
    --accent: var(--magenta);
    --accent-dim: #f7d6ec;
    --row-hover: #fdf0d9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .header-row { display: flex; align-items: center; gap: 16px; }
  .header-photo {
    width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--marigold); box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    flex: 0 0 auto;
  }
  h1 {
    font-family: 'Jokerman', 'Herculanum', 'Copperplate', cursive, fantasy;
    font-size: 40px; line-height: 140px; margin: 0; font-weight: normal; letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--magenta), var(--orange) 35%, var(--teal) 70%, var(--periwinkle));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.06);
  }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }
  .controls {
    display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
  }
  .fav-filter {
    display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;
    user-select: none;
  }
  .fav-filter input { accent-color: var(--magenta); width: 15px; height: 15px; cursor: pointer; }
  .count { color: var(--text-dim); font-size: 13px; margin-left: auto; }
  .table-scroll {
    width: 100%; overflow: auto; border: 1px solid var(--border);
    border-radius: 8px; background: var(--panel);
    max-height: calc(100vh - 160px);
  }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel);
    font-size: 13px; white-space: nowrap;
  }
  thead th {
    text-align: left; padding: 10px 12px; background: var(--marigold); color: #3a2400;
    border-bottom: 2px solid var(--orange); cursor: pointer; user-select: none;
    white-space: nowrap; position: sticky; top: 0; z-index: 2;
  }
  thead th:hover { background: #ffbe35; }
  thead th.sorted { color: var(--magenta); }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: 0.8; }
  tbody tr:hover td { background: var(--row-hover); }
  tbody tr:hover td.sticky-fav, tbody tr:hover td.sticky-addr { background: var(--row-hover); }
  td { padding: 8px 12px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  .sticky-fav {
    width: 40px; text-align: center; padding: 8px 4px;
    position: sticky; left: 0; background: var(--panel); z-index: 1;
  }
  .sticky-addr {
    min-width: 220px;
    position: sticky; left: 40px; background: var(--panel); z-index: 1;
    box-shadow: 1px 0 0 0 var(--orange);
  }
  thead th.sticky-fav, thead th.sticky-addr { background: var(--marigold); z-index: 3; }
  a.listing-link { color: var(--magenta); text-decoration: none; font-weight: 600; }
  a.listing-link:hover { text-decoration: underline; color: var(--pink); }
  .map-link {
    display: block; text-decoration: none; font-size: 12px; margin-top: 3px;
    color: var(--teal); font-weight: 600;
  }
  .map-link:hover { text-decoration: underline; color: var(--green); }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: var(--teal); color: #fff; margin-left: 6px;
  }
  .fav-btn {
    background: none; border: none; cursor: pointer; font-size: 19px; line-height: 1;
    padding: 4px; color: var(--border); vertical-align: middle;
  }
  .fav-btn.is-fav { color: var(--marigold); text-shadow: 0 0 1px var(--orange); }
  .fav-btn:hover { color: var(--orange); }
  .comment-input {
    width: 220px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: var(--panel); color: var(--text); white-space: normal;
    font-family: inherit;
  }
  .comment-input:focus { outline: none; border-color: var(--teal); }
  td.gallery-cell { padding: 8px 12px; width: 1%; }
  .gallery {
    display: flex; gap: 6px; overflow-x: auto; height: 110px; width: 480px;
  }
  .gallery img {
    height: 110px; width: auto; border-radius: 5px; flex: 0 0 auto; cursor: zoom-in;
    object-fit: cover;
  }
  .gallery-empty { color: var(--text-dim); font-size: 12px; font-style: italic; white-space: nowrap; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; z-index: 100;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 4px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .load-status {
    text-align: center; margin-top: 14px; font-size: 13px; color: var(--text-dim);
  }
  .stripe {
    height: 6px; border-radius: 3px; margin-bottom: 16px;
    background: repeating-linear-gradient(90deg,
      var(--pink) 0 8%, var(--orange) 8% 16%, var(--marigold) 16% 24%,
      var(--green) 24% 32%, var(--teal) 32% 40%, var(--periwinkle) 40% 48%,
      var(--magenta) 48% 56%, var(--pink) 56% 64%, var(--orange) 64% 72%,
      var(--marigold) 72% 80%, var(--green) 80% 88%, var(--teal) 88% 96%, var(--periwinkle) 96% 100%);
  }

  /* --- Mobile: same table, just bigger and more touch-friendly --- */
  @media (max-width: 700px) {
    body { padding: 14px; }
    h1 { font-size: 22px; line-height: 90px; }
    .header-photo { width: 90px; height: 90px; }
    table { font-size: 15px; }
    thead th { padding: 12px 14px; }
    td { padding: 10px 14px; }
    .sticky-fav, .sticky-addr { position: static; left: auto; box-shadow: none; min-width: 0; }
    .fav-btn { font-size: 22px; }
    .gallery { height: 130px; }
    .gallery img { height: 130px; }
    .comment-input { width: 180px; }
  }
</style>
</head>
<body>

<div class="header-row">
  <h1>LISTINGS FOR LINDA</h1>
  <img class="header-photo" src="assets/linda-header.png" alt="Linda">
</div>
<div class="stripe"></div>
<div class="subtitle" id="subtitle">Loading…</div>

<div class="controls">
  <label class="fav-filter"><input type="checkbox" id="favOnly"> Show favorites only</label>
  <span class="count" id="count"></span>
</div>

<div class="table-scroll" id="tableScroll">
<table id="table">
  <thead>
    <tr id="headerRow"></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<div class="load-status" id="loadStatus"></div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
const favorites = new Set(JSON.parse(localStorage.getItem('apartmentFinderFavorites') || '[]'));
const comments = JSON.parse(localStorage.getItem('apartmentFinderComments') || '{}');

function saveFavorites() { localStorage.setItem('apartmentFinderFavorites', JSON.stringify([...favorites])); }
function saveComments() { localStorage.setItem('apartmentFinderComments', JSON.stringify(comments)); }

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function mapsUrl(row) {
  if (row.latitude != null && row.longitude != null) {
    return `https://www.google.com/maps/search/?api=1&query=${row.latitude},${row.longitude}`;
  }
  const q = [row.street_address, row.area, row.municipality].filter(Boolean).join(', ');
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}

function toggleFavorite(id, btn) {
  const isFav = favorites.has(id);
  if (isFav) favorites.delete(id); else favorites.add(id);
  btn.classList.toggle('is-fav', !isFav);
  btn.textContent = !isFav ? '★' : '☆';
  const row = listings.find(l => l.booli_id === id);
  if (row) row.favorite = !isFav ? 1 : 0;
  saveFavorites();
  if (favOnly) render();
}

function updateComment(id, value) {
  comments[id] = value;
  const row = listings.find(l => l.booli_id === id);
  if (row) row.comment = value;
}
function commitComment() { saveComments(); }

const COLUMNS = [
  { key: 'favorite', label: '★', sticky: 'fav', sortable: true,
    render: (v, row) => `<button type="button" class="fav-btn${favorites.has(row.booli_id) ? ' is-fav' : ''}" onclick="toggleFavorite('${row.booli_id}', this)">${favorites.has(row.booli_id) ? '★' : '☆'}</button>` },
  { key: 'street_address', label: 'Address', sticky: 'addr', render: (v, row) => `<a class="listing-link" href="${row.url}" target="_blank" rel="noopener">${v || '—'}</a>${row.upcoming_sale ? '<span class="badge">Upcoming</span>' : ''}<a class="map-link" href="${mapsUrl(row)}" target="_blank" rel="noopener">Show on map</a>` },
  { key: 'area', label: 'Area' },
  { key: 'rooms_sort', label: 'Rooms', numeric: true, render: (v) => v != null ? v : '—' },
  { key: 'size_sort', label: 'Size', numeric: true, render: (v) => v != null ? v + ' m²' : '—' },
  { key: 'floor_sort', label: 'Floor', numeric: true, render: (v) => v != null ? v : '—' },
  { key: 'list_price', label: 'Price', numeric: true, render: (v) => v ? v.toLocaleString('en-US') + ' kr' : '—' },
  { key: 'fee_sort', label: 'Fee', numeric: true, render: (v) => v != null ? v.toLocaleString('en-US') + ' kr/month' : '—' },
  { key: 'published', label: 'Listed', render: (v) => v ? v.split(' ')[0] : '—' },
  { key: 'comment', label: 'Comment', sortable: false,
    render: (v, row) => `<input type="text" class="comment-input" value="${escapeAttr(comments[row.booli_id] || '')}" placeholder="Write a comment…" oninput="updateComment('${row.booli_id}', this.value)" onchange="commitComment()" onclick="event.stopPropagation()">` },
  { key: 'photo_count', label: 'Photos', numeric: true, sortable: true, gallery: true },
];

let listings = [];
let sortKey = 'published';
let sortDir = -1;
let favOnly = false;
let visibleCount = 50;
let filteredCount = 0;
const CHUNK_SIZE = 50;

function numFromText(text) {
  if (!text) return null;
  const m = String(text).replace(/\s/g, '').match(/[\d.,]+/);
  return m ? parseFloat(m[0].replace(',', '.')) : null;
}

function prepare(rows) {
  return rows.map(r => ({
    ...r,
    rooms_sort: r.rooms != null ? r.rooms : numFromText(r.rooms_text),
    size_sort: r.living_area_sqm != null ? r.living_area_sqm : numFromText(r.size_sqm),
    floor_sort: r.floor != null ? r.floor : numFromText(r.floor_text),
    fee_sort: r.rent_monthly != null ? r.rent_monthly : numFromText(r.fee_text),
    photo_count: (r.photos || []).length,
    favorite: favorites.has(r.booli_id) ? 1 : 0,
    comment: comments[r.booli_id] || '',
  }));
}

function renderHeader() {
  const tr = document.getElementById('headerRow');
  tr.innerHTML = '';
  COLUMNS.forEach(col => {
    const th = document.createElement('th');
    th.textContent = col.label;
    if (col.sticky) th.classList.add('sticky-col', 'sticky-' + col.sticky);
    if (col.sortable === false) { tr.appendChild(th); return; }
    if (col.key === sortKey) {
      th.classList.add('sorted');
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
    th.addEventListener('click', () => {
      if (sortKey === col.key) sortDir *= -1;
      else { sortKey = col.key; sortDir = (col.key === 'published' || col.key === 'favorite') ? -1 : 1; }
      visibleCount = CHUNK_SIZE;
      render();
      document.getElementById('tableScroll').scrollTop = 0;
    });
    tr.appendChild(th);
  });
}

function thumbUrl(fullUrl) {
  return fullUrl.replace(/_\d+x0(\.\w+)$/, '_300x0$1');
}

function galleryHtml(row) {
  if (!row.photos || row.photos.length === 0) {
    return '<div class="gallery-empty">No photos fetched — see listing</div>';
  }
  return `<div class="gallery">${row.photos.map(p => `<img src="${thumbUrl(p)}" loading="lazy" decoding="async" onclick="openLightbox('${p}')">`).join('')}</div>`;
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

function render() {
  renderHeader();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  let rows = listings.filter(r => {
    if (favOnly && !favorites.has(r.booli_id)) return false;
    return true;
  });

  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv, 'en') * sortDir;
    return (av - bv) * sortDir;
  });

  if (visibleCount > rows.length) visibleCount = Math.max(CHUNK_SIZE, rows.length);
  filteredCount = rows.length;
  const pageRows = rows.slice(0, visibleCount);

  document.getElementById('count').textContent = rows.length
    ? `${pageRows.length} of ${rows.length} apartments`
    : `0 of ${listings.length} apartments`;

  document.getElementById('loadStatus').textContent =
    pageRows.length < rows.length ? 'Scroll for more ↓' : (rows.length ? 'All apartments loaded' : '');

  pageRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = COLUMNS.map(col => {
      const label = escapeAttr(col.label);
      if (col.gallery) return `<td class="gallery-cell" data-label="${label}">${galleryHtml(row)}</td>`;
      const val = row[col.key];
      const rendered = col.render ? col.render(val, row) : (val ?? '—');
      const classes = [col.numeric ? 'num' : '', col.sticky ? 'sticky-col sticky-' + col.sticky : ''].filter(Boolean).join(' ');
      return `<td class="${classes}" data-label="${label}">${rendered}</td>`;
    }).join('');
    tbody.appendChild(tr);
  });
}

document.getElementById('favOnly').addEventListener('change', e => {
  favOnly = e.target.checked;
  visibleCount = CHUNK_SIZE;
  render();
});

const tableScrollEl = document.getElementById('tableScroll');
tableScrollEl.addEventListener('scroll', () => {
  const nearBottom = tableScrollEl.scrollTop + tableScrollEl.clientHeight >= tableScrollEl.scrollHeight - 200;
  if (nearBottom && visibleCount < filteredCount) {
    visibleCount += CHUNK_SIZE;
    render();
  }
});

fetch('data/listings.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const rawListings = Array.isArray(data) ? data : data.listings;
    const scrapedAt = Array.isArray(data) ? null : data.scraped_at;
    listings = prepare(rawListings);
    const withFullGallery = listings.filter(l => (l.photos || []).length > 5).length;
    const scrapedText = scrapedAt
      ? new Date(scrapedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })
      : 'unknown';
    document.getElementById('subtitle').textContent =
      `${listings.length} apartments · ${withFullGallery} with full photo gallery · data scraped ${scrapedText}`;
    render();
  })
  .catch(err => {
    document.getElementById('subtitle').textContent = 'Could not load data/listings.json — run the scraper first, and serve this page via a local HTTP server (not file://).';
    console.error(err);
  });
</script>

</body>
</html>
